<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152a"><meta name="description" content="接住星星，閃開炸彈！用方向鍵、滑鼠或手指，挑戰 60 秒的星際冒險。"><title>星星接接樂 · Star Catcher</title>
<link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="brand"><span class="logo">✦</span>STAR CATCHER</div><span class="edition">你的 60 秒星際小冒險</span></header><section class="heading"><div><h1>星星接接樂</h1><p class="sub">接住一點星光，讓今天亮一點。</p></div><div class="best">最佳紀錄<strong id="best">0</strong></div></section><section class="arena" aria-label="接星星遊戲區"><canvas id="game" aria-label="左右移動飛船，接住黃色星星、避開紅色炸彈"></canvas><div class="hud"><div class="stats"><div class="stat"><label>分數</label><b id="score">0</b></div><div class="stat"><label>剩餘時間</label><b id="time">60<span style="font-size:14px;color:#a5b1ce"> s</span></b></div><div class="stat"><label>生命</label><b class="hearts" id="life">♥♥♥</b></div></div><div class="tools"><button class="iconbtn" id="sound" aria-label="開啟音效" title="音效">♪</button><button class="iconbtn" id="pause" aria-label="暫停遊戲" title="暫停（P）">Ⅱ</button></div></div><div class="overlay" id="overlay"><div class="hero-star" id="symbol">✦</div><div class="eyebrow">A LITTLE COSMIC ESCAPE</div><h2 id="title">準備好收集星光了嗎？</h2><p class="message" id="message">移動小飛船，接住掉落的星星。<br>小心炸彈！你有 3 次機會。</p><button class="primary" id="start">開始遊戲</button><div class="hint" id="hint">按空白鍵也能開始</div></div></section><div class="bottom"><div class="rules"><span><i style="color:#ffdc83">✦</i> 星星 +10 分</span><span><i>💣</i> 炸彈 −1 生命</span><span><i style="color:#aef0d6">◷</i> 挑戰 60 秒</span></div><div class="keys"><kbd>←</kbd><kbd>→</kbd> 移動 <span style="margin-left:12px">也可用滑鼠或手指</span></div><div class="mobile"><button id="left" aria-label="向左移動">◀</button><button id="right" aria-label="向右移動">▶</button></div></div><footer>MADE FOR A SMALL BREAK · 休息一下，再出發</footer></main>
<script src="game.js"></script></body></html>
